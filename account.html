<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your LunaStep account — profile details and order history." />
  <title>My Account — LunaStep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .profile-header { display:flex; align-items:center; gap:20px; background:var(--card); border:1px solid var(--border);
      border-radius:var(--r-md); padding:28px; margin-bottom:24px; box-shadow:0 6px 20px rgba(0,0,0,.04); flex-wrap:wrap; }
    .avatar { width:76px; height:76px; border-radius:50%; background:var(--primary); color:#fff; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; letter-spacing:.5px; }
    .profile-meta h1 { font-size:24px; margin-bottom:4px; }
    .profile-meta p { color:var(--text-dim); font-size:14px; }
    .role-pill { display:inline-block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
      padding:4px 12px; border-radius:20px; background:var(--accent); color:#111; margin-top:8px; }
    .account-grid { display:grid; grid-template-columns:1fr 1.3fr; gap:24px; align-items:start; }
    @media(max-width:820px){ .account-grid { grid-template-columns:1fr; } }
    .acard { background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:24px;
      box-shadow:0 6px 20px rgba(0,0,0,.04); }
    .acard h3 { font-size:16px; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
    .stat-row { display:flex; gap:14px; margin-bottom:22px; }
    .stat { flex:1; background:var(--bg2); border-radius:12px; padding:14px; text-align:center; }
    .stat .num { font-size:22px; font-weight:800; }
    .stat .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); }
    .order-item { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
    .order-item .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
    .order-item .onum { font-weight:800; font-size:14px; }
    .order-item .meta { font-size:12px; color:var(--text-dim); display:flex; gap:16px; flex-wrap:wrap; }
    .st { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:4px 10px; border-radius:20px; }
    .st-done { background:rgba(16,185,129,.15); color:#059669; }
    .st-ship { background:rgba(37,99,235,.15); color:#2563EB; }
    .st-pending { background:rgba(245,158,11,.18); color:#B45309; }
    .st-cancel { background:rgba(221,51,51,.15); color:#DD3333; }
    .empty { text-align:center; padding:30px; color:var(--text-faint); }
    .pw-field { position:relative; }
    .pw-field .form-input { padding-right:62px; }
    .pw-toggle { position:absolute; top:50%; right:10px; transform:translateY(-50%); background:none; border:none;
      cursor:pointer; color:var(--secondary); font-size:12px; font-weight:800; font-family:inherit; padding:4px 6px; }
  </style>
</head>
<body>

  <!-- NAVIGATION BAR -->
  <div class="topbar" id="topbar">
    <a href="index.html" class="brand"><span class="mark"></span> LunaStep</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="products.html" class="nav-link">Shop</a>
      <a href="about.html" class="nav-link">About Us</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </div>
    <div class="topbar-actions">
      <a href="cart.html" class="icon-btn" title="Shopping Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="app">
    <!-- PROFILE HEADER -->
    <div class="profile-header">
      <div class="avatar" id="avatar">–</div>
      <div class="profile-meta" style="flex:1;">
        <h1 id="fullName">Loading…</h1>
        <p id="emailLine">—</p>
        <span class="role-pill" id="rolePill">Customer</span>
      </div>
      <a href="products.html" class="btn btn-primary btn-sm">Continue Shopping →</a>
    </div>

    <div class="account-grid">

      <!-- ACCOUNT DETAILS / EDIT -->
      <div class="acard">
        <h3>👤 Account Details</h3>
        <form id="profileForm">
          <div class="form-row">
            <div class="form-group">
              <label for="pFirst">First Name</label>
              <input type="text" id="pFirst" class="form-input" required />
            </div>
            <div class="form-group">
              <label for="pLast">Last Name</label>
              <input type="text" id="pLast" class="form-input" required />
            </div>
          </div>
          <div class="form-group">
            <label for="pEmail">Email (cannot be changed)</label>
            <input type="email" id="pEmail" class="form-input" readonly style="background:var(--bg2); cursor:not-allowed;" />
          </div>
          <div class="form-group">
            <label for="pPhone">Phone Number</label>
            <input type="tel" id="pPhone" class="form-input" placeholder="+1 (555) 123-4567" />
          </div>
          <div class="form-group">
            <label for="pPass">New Password <span style="color:var(--text-faint); font-weight:600;">(leave blank to keep current)</span></label>
            <div class="pw-field">
              <input type="password" id="pPass" class="form-input" placeholder="••••••••" minlength="6" />
              <button type="button" class="pw-toggle" data-target="pPass">Show</button>
            </div>
          </div>
          <div class="msg-error" id="profileError"></div>
          <div class="msg-success" id="profileSuccess">Profile updated successfully!</div>
          <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        </form>
        <p style="font-size:12px; color:var(--text-faint); margin-top:14px;" id="memberSince"></p>
      </div>

      <!-- ORDER HISTORY -->
      <div class="acard">
        <h3>📦 My Orders</h3>
        <div class="stat-row">
          <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Orders</div></div>
          <div class="stat"><div class="num" id="statSpent">$0</div><div class="lbl">Total Spent</div></div>
          <div class="stat"><div class="num" id="statPending">0</div><div class="lbl">In Progress</div></div>
        </div>
        <div id="ordersList">
          <div class="empty">Loading your orders…</div>
        </div>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="api-config.js"></script>
  <script src="script.js"></script>
  <script>
    // ---- Require login ----
    let customer = (typeof getCurrentCustomer === 'function') ? getCurrentCustomer() : null;
    if (!customer) { window.location.href = 'login.html'; }

    const statusClass = (s) => ({
      delivered:'st-done', done:'st-done', shipped:'st-ship', ship:'st-ship',
      processing:'st-pending', pending:'st-pending', cancelled:'st-cancel'
    }[s] || 'st-pending');
    const statusLabel = (s) => ({
      delivered:'Delivered', shipped:'Shipped', processing:'Processing',
      pending:'Pending', cancelled:'Cancelled'
    }[s] || (s ? s.charAt(0).toUpperCase()+s.slice(1) : 'Pending'));
    const fmtDate = (d) => { try { return new Date(d.replace(' ','T')).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); } catch { return d || ''; } };

    function renderProfile(u) {
      const fn = u.first_name || 'User', ln = u.last_name || '';
      document.getElementById('avatar').textContent = ((fn[0]||'')+(ln[0]||'')).toUpperCase();
      document.getElementById('fullName').textContent = `${fn} ${ln}`.trim();
      document.getElementById('emailLine').textContent = u.email || '';
      document.getElementById('rolePill').textContent = u.role || 'Customer';
      document.getElementById('pFirst').value = fn;
      document.getElementById('pLast').value = ln;
      document.getElementById('pEmail').value = u.email || '';
      document.getElementById('pPhone').value = u.phone || '';
      if (u.created_at) document.getElementById('memberSince').textContent = 'Member since ' + fmtDate(u.created_at);
    }

    function renderOrders(orders) {
      const list = document.getElementById('ordersList');
      if (!orders || !orders.length) {
        list.innerHTML = '<div class="empty">You have no orders yet.<br><a href="products.html" style="color:var(--primary); font-weight:800;">Start shopping →</a></div>';
        document.getElementById('statTotal').textContent = '0';
        return;
      }
      let spent = 0, pending = 0;
      list.innerHTML = orders.map(o => {
        spent += parseFloat(o.total_amount || 0);
        if (['pending','processing','shipped'].includes(o.status)) pending++;
        return `
          <div class="order-item">
            <div class="top">
              <span class="onum">${o.order_number || '#'+o.id}</span>
              <span class="st ${statusClass(o.status)}">${statusLabel(o.status)}</span>
            </div>
            <div class="meta">
              <span>🗓️ ${fmtDate(o.created_at)}</span>
              <span>💳 ${(o.payment_method||'').toUpperCase()}</span>
              <span style="font-weight:800; color:var(--text);">$${parseFloat(o.total_amount||0).toFixed(2)}</span>
            </div>
          </div>`;
      }).join('');
      document.getElementById('statTotal').textContent = orders.length;
      document.getElementById('statSpent').textContent = '$' + spent.toFixed(0);
      document.getElementById('statPending').textContent = pending;
    }

    // ---- Initial render from cached data, then refresh from backend ----
    if (customer) renderProfile(customer);

    (async function init() {
      // Fresh profile from session
      const prof = await apiFetch('/auth.php?action=profile');
      if (prof && prof.user) {
        customer = prof.user;
        localStorage.setItem('shoestore_customer', JSON.stringify(customer));
        renderProfile(customer);
      }
      // Orders for this customer
      if (customer && customer.id) {
        const orders = await apiFetch('/orders.php?user_id=' + encodeURIComponent(customer.id));
        renderOrders(Array.isArray(orders) ? orders : []);
      } else {
        renderOrders([]);
      }
    })();

    // ---- Password show/hide ----
    document.querySelectorAll('.pw-toggle').forEach(btn => btn.addEventListener('click', () => {
      const i = document.getElementById(btn.dataset.target);
      const reveal = i.type === 'password';
      i.type = reveal ? 'text' : 'password';
      btn.textContent = reveal ? 'Hide' : 'Show';
    }));

    // ---- Save profile ----
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('profileError').style.display = 'none';
      document.getElementById('profileSuccess').style.display = 'none';
      const body = {
        first_name: document.getElementById('pFirst').value.trim(),
        last_name: document.getElementById('pLast').value.trim(),
        phone: document.getElementById('pPhone').value.trim()
      };
      const pass = document.getElementById('pPass').value;
      if (pass) body.password = pass;

      const result = await apiFetch('/auth.php?action=update-profile', { method: 'POST', body });
      if (result && !result.error && result.user) {
        customer = result.user;
        localStorage.setItem('shoestore_customer', JSON.stringify(customer));
        renderProfile(customer);
        document.getElementById('pPass').value = '';
        document.getElementById('profileSuccess').style.display = 'block';
        showToast('Profile updated!', 'success');
        return;
      }
      const el = document.getElementById('profileError');
      el.textContent = (result && result.message) ? result.message : 'Could not update profile. Is the server running?';
      el.style.display = 'block';
    });

    // ---- Logout ----
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await apiFetch('/auth.php?action=logout', { method: 'POST' });
      localStorage.removeItem('shoestore_customer');
      localStorage.removeItem('role');
      showToast('Logged out.', 'success');
      setTimeout(() => window.location.href = 'login.html', 500);
    });
  </script>
</body>
</html>
