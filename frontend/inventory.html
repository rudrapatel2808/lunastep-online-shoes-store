<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Manager - ShoeStore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- RBAC Check -->
  <script src="auth.js"></script>
  <script>checkAuth('manager');</script>

  <div class="topbar">
    <div class="brand"><span class="mark"></span> ShoeStore Inventory</div>
    <div class="tabs">
      <a href="inventory.html" class="tab active">Inventory Explorer</a>
      <a href="index.html" class="tab">View Store</a>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="app">
    <div class="section reveal in">
      <h2 class="section-title">Inventory Explorer</h2>
      <p style="color:var(--text-dim); margin-bottom:34px;">AI-driven stock predictions and real-time velocity tracking.</p>
      <div class="glass panel">
        <div class="panel-head" style="display:flex; justify-content:space-between; margin-bottom:20px;">
          <h3>Low Stock Alerts (Predicted < 48h)</h3>
        </div>
        <table>
          <thead><tr><th>SKU</th><th>Style</th><th>Size</th><th>Remaining</th><th>Velocity</th><th>Action</th></tr></thead>
          <tbody id="lowStockBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
